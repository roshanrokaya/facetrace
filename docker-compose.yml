version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: facetrace-postgres
    environment:
      POSTGRES_USER: facetrace
      POSTGRES_PASSWORD: facetrace_password
      POSTGRES_DB: facetrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facetrace-backend
    environment:
      DATABASE_URL: postgresql+psycopg://facetrace:facetrace_password@postgres:5432/facetrace
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facetrace-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
